name: Verificar e publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run validate

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ajustar o manifesto para esta versão
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export REPO="${GITHUB_REPOSITORY}"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));
            const { VERSION, REPO } = process.env;
            m.version = VERSION;
            m.url = `https://github.com/${REPO}`;
            m.manifest = `https://github.com/${REPO}/releases/latest/download/system.json`;
            m.download = `https://github.com/${REPO}/releases/download/v${VERSION}/mmrpg-${VERSION}.zip`;
            fs.writeFileSync("system.json", JSON.stringify(m, null, 2) + "\n");
          '
      - run: node scripts/package.mjs
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/system.json
            dist/mmrpg-*.zip
